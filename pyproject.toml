
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "locks-kv"
version = "0.1.7.dev20261109"
description = "LOCKS: Page-Local Compact Key Summaries for efficient long-context decoding -- optimized GQA and MLA page selection with optional host-backed GQA KV"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Junsung Hwang", email = "junsung.k.hwang@gmail.com" },
]
keywords = [
  "vllm", "kv-cache", "sparse-attention", "llm-inference",
  "decode", "long-context", "flash-attention", "cuda",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Environment :: GPU :: NVIDIA CUDA",
]

dependencies = [
  "torch>=2.4",
  "triton>=3.0",
  "ninja>=1.11",
]

[project.optional-dependencies]
vllm = ["vllm>=0.24,<0.25"]
yaml = ["pyyaml>=6.0"]
all = ["vllm>=0.24,<0.25", "transformers>=4.40", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/Js-Hwang1/locks-kv"
Repository = "https://github.com/Js-Hwang1/locks-kv"
Issues = "https://github.com/Js-Hwang1/locks-kv/issues"


[project.entry-points."vllm.general_plugins"]
locks = "locks.backend.register:register"

[tool.setuptools.packages.find]
where = ["src"]
include = ["locks*"]

[tool.setuptools.package-data]
locks = ["selection/*.cu"]
